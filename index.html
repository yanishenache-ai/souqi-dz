<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سوقي DZ</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#222;
}

header{
background:#111827;
color:white;
padding:18px;
text-align:center;
}

header h1{
margin:0 0 6px;
}

nav{
display:flex;
justify-content:center;
gap:10px;
margin-top:15px;
flex-wrap:wrap;
}

nav button{
border:0;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
}

.container{
max-width:1100px;
margin:25px auto;
padding:0 15px;
}

.search{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
margin-bottom:20px;
font-size:16px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:190px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.price{
font-size:20px;
font-weight:bold;
margin:10px 0;
}

.btn{
background:#111827;
color:white;
border:0;
padding:11px 15px;
border-radius:8px;
cursor:pointer;
width:100%;
}

.form{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.form input,
.form textarea{
width:100%;
padding:12px;
margin:8px 0 15px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

.hidden{
display:none;
}

.message{
padding:15px;
background:white;
border-radius:10px;
margin-bottom:15px;
}

footer{
text-align:center;
padding:30px;
color:#777;
}

</style>

</head>

<body>

<header>

<h1>🛒 سوقي DZ</h1>

<p>سوق إلكتروني جزائري بسيط</p>

<nav>

<button onclick="showPage('home')">
المنتجات
</button>

<button onclick="showPage('add')">
أضف منتجًا
</button>

</nav>

</header>


<div class="container">


<section id="home">

<h2>المنتجات</h2>

<input
class="search"
id="search"
placeholder="🔎 ابحث عن منتج..."
oninput="displayProducts()">

<div class="products" id="products">

<p>جاري تحميل المنتجات...</p>

</div>

</section>



<section id="add" class="hidden">

<h2>إضافة منتج</h2>

<div class="form">

<label>اسم المنتج</label>

<input
id="productName"
placeholder="مثال: هاتف">


<label>السعر بالدينار</label>

<input
id="productPrice"
type="number"
placeholder="مثال: 25000">


<label>رابط صورة المنتج</label>

<input
id="productImage"
placeholder="ضع رابط الصورة">


<label>وصف المنتج</label>

<textarea
id="productDescription"
placeholder="اكتب وصفًا مختصرًا"></textarea>


<button
class="btn"
onclick="addProduct()">

إضافة المنتج

</button>

</div>

</section>



<section id="order" class="hidden">

<h2>طلب المنتج</h2>

<div class="form">

<p id="selectedProduct"></p>

<label>اسمك</label>

<input
id="buyerName"
placeholder="اسمك الكامل">


<label>رقم الهاتف</label>

<input
id="buyerPhone"
type="tel"
placeholder="رقم الهاتف">


<label>الولاية والعنوان</label>

<textarea
id="buyerAddress"
placeholder="الولاية والعنوان"></textarea>


<button
class="btn"
onclick="submitOrder()">

تأكيد الطلب

</button>

</div>

</section>


</div>


<footer>

سوقي DZ © 2026

</footer>



<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
'https://sjxjhyqayhscbqqniemp.supabase.co';


sb_publishable_nTr9xyFihJNfs91HVbnHCg_lqFc6x_n


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



let products = [];

let selectedProduct = null;



async function loadProducts(){

const { data, error } = await supabaseClient

.from("products")

.select("*")

.order("created_at", {
ascending:false
});


if(error){

console.error(error);

document.getElementById("products").innerHTML =
"<p>حدث خطأ أثناء تحميل المنتجات.</p>";

return;

}


products = data || [];

displayProducts();

}



function displayProducts(){

let search =
document
.getElementById("search")
.value
.toLowerCase();


let list =
products.filter(p =>
(p.name || "")
.toLowerCase()
.includes(search)
);


let html = "";


list.forEach((p,index)=>{

html += `

<div class="card">

<img
src="${p.image_url || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600'}"
alt="${p.name}">

<div class="card-content">

<h3>${p.name}</h3>

<p>${p.description || "لا يوجد وصف."}</p>

<div class="price">
${Number(p.price).toLocaleString()} دج
</div>

<button
class="btn"
onclick="orderProduct(${index})">

اطلب المنتج

</button>

</div>

</div>

`;

});


document.getElementById("products").innerHTML =
html ||
"<p>لم يتم العثور على منتجات.</p>";

}



async function addProduct(){
alert("الزر يعمل");
let name =
document
.getElementById("productName")
.value
.trim();
alert("الاسم: " + name);

let price =
Number(
document
.getElementById("productPrice")
.value
);


let image =
document
.getElementById("productImage")
.value
.trim();


let description =
document
.getElementById("productDescription")
.value
.trim();


if(!name || !price){

alert("أدخل اسم المنتج والسعر.");

return;

}

alert("وصلنا إلى مرحلة حفظ المنتج");
const { error } = await supabaseClient

.from("products")

.insert({

name:name,

price:price,

description:
description || "لا يوجد وصف.",

image_url:
image ||
"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600"

});


if(error){

console.error(error);

alert("حدث خطأ أثناء إضافة المنتج.");

return;

}


alert("تمت إضافة المنتج بنجاح.");


document.getElementById("productName").value="";

document.getElementById("productPrice").value="";

document.getElementById("productImage").value="";

document.getElementById("productDescription").value="";


await loadProducts();

showPage("home");

}



function orderProduct(index){

selectedProduct =
products[index];


document.getElementById("selectedProduct").innerHTML =

"<strong>" +
selectedProduct.name +
"</strong><br>" +

"السعر: " +
Number(selectedProduct.price).toLocaleString() +
" دج";


showPage("order");

}



async function submitOrder(){

if(!selectedProduct){

alert("لم يتم اختيار منتج.");

return;

}


let buyerName =
document
.getElementById("buyerName")
.value
.trim();


let buyerPhone =
document
.getElementById("buyerPhone")
.value
.trim();


let buyerAddress =
document
.getElementById("buyerAddress")
.value
.trim();


if(!buyerName ||
!buyerPhone ||
!buyerAddress){

alert("يرجى ملء جميع المعلومات.");

return;

}


let totalPrice =
Number(selectedProduct.price);


let commission =
totalPrice * 0.05;


const { error } =
await supabaseClient

.from("orders")

.insert({

product_id:
selectedProduct.id,

buyer_name:
buyerName,

buyer_phone:
buyerPhone,

buyer_address:
buyerAddress,

quantity:1,

total_price:
totalPrice,

commission:
commission

});


if(error){

console.error(error);

alert(
"حدث خطأ أثناء تسجيل الطلب."
);

return;

}


alert(

"تم تسجيل الطلب بنجاح!\\n\\n" +

"سعر المنتج: " +

totalPrice.toLocaleString() +

" دج\\n" +

"عمولة سوقي DZ: " +

commission.toLocaleString() +

" دج"

);


document.getElementById("buyerName").value="";

document.getElementById("buyerPhone").value="";

document.getElementById("buyerAddress").value="";


selectedProduct = null;

showPage("home");

}



function showPage(page){

document
.getElementById("home")
.classList.add("hidden");

document
.getElementById("add")
.classList.add("hidden");

document
.getElementById("order")
.classList.add("hidden");


document
.getElementById(page)
.classList.remove("hidden");


if(page === "home"){

displayProducts();

}

}



loadProducts();


</script>


</body>

  </html>
