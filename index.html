<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سوقي DZ</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f6fa;
color:#222;
}

header{
background:#111827;
color:white;
padding:18px;
text-align:center;
}

header h1{
margin:0 0 10px;
}

nav{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

nav button{
border:0;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
background:#2563eb;
color:white;
font-size:15px;
}

nav button:hover{
background:#1d4ed8;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.page{
display:none;
}

.page.active{
display:block;
}

.search{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
margin-bottom:20px;
font-size:16px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:12px;
padding:15px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
border-radius:10px;
}

.card h3{
margin-bottom:8px;
}

.price{
font-size:20px;
font-weight:bold;
color:#16a34a;
margin:10px 0;
}

.card button,
form button{
width:100%;
padding:12px;
border:0;
border-radius:8px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
}

.card button:hover,
form button:hover{
background:#1d4ed8;
}

form{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
max-width:600px;
margin:auto;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin:8px 0 15px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

textarea{
min-height:100px;
resize:vertical;
}

.form-title{
text-align:center;
margin-bottom:20px;
}

.message{
padding:12px;
border-radius:8px;
margin:10px 0;
display:none;
}

.success{
background:#dcfce7;
color:#166534;
}

.error{
background:#fee2e2;
color:#991b1b;
}

.account-box{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
max-width:600px;
margin:auto;
}

.account-box h2{
margin-top:0;
}

.user-box{
text-align:center;
margin-top:10px;
font-size:14px;
}

.logout{
background:#dc2626 !important;
}

.logout:hover{
background:#b91c1c !important;
}

.product-info{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
max-width:600px;
margin:auto;
}

footer{
margin-top:40px;
background:#111827;
color:white;
text-align:center;
padding:20px;
}

</style>
</head>

<body>

<header>

<h1>🛒 سوقي DZ</h1>

<nav>

<button onclick="showPage('home')">
المنتجات
</button>

<button onclick="showPage('add')">
➕ إضافة منتج
</button>

<button onclick="showPage('order')">
📦 طلباتي
</button>

<button onclick="showPage('account')">
👤 حساب البائع
</button>

</nav>

<div id="userBox" class="user-box"></div>

</header>


<div class="container">


<!-- الصفحة الرئيسية -->

<section id="home" class="page active">

<h2>🛍️ المنتجات</h2>

<input
class="search"
id="search"
placeholder="🔎 ابحث عن منتج..."
oninput="displayProducts()"
>

<div id="products" class="products">

<p>جاري تحميل المنتجات...</p>

</div>

</section>


<!-- إضافة منتج -->

<section id="add" class="page">

<h2>➕ إضافة منتج</h2>

<div id="sellerStatus"></div>

<form onsubmit="addProduct(event)">

<label>
اسم المنتج
</label>

<input
type="text"
id="productName"
required
>

<label>
السعر بالدينار
</label>

<input
type="number"
id="productPrice"
min="0"
required
>

<label>
رابط صورة المنتج
</label>

<input
type="url"
id="productImage"
placeholder="https://..."
>

<label>
وصف المنتج
</label>

<textarea
id="productDescription"
placeholder="اكتب وصف المنتج..."
></textarea>

<button type="submit">
➕ إضافة المنتج
</button>

<div id="addMessage" class="message"></div>

</form>

</section>


<!-- طلب المنتج -->

<section id="order" class="page">

<h2>📦 طلب المنتج</h2>

<div id="selectedProduct"></div>

<form onsubmit="submitOrder(event)">

<label>
الاسم الكامل
</label>

<input
type="text"
id="buyerName"
required
>

<label>
رقم الهاتف
</label>

<input
type="tel"
id="buyerPhone"
required
>

<label>
الولاية والعنوان
</label>

<textarea
id="buyerAddress"
placeholder="اكتب الولاية والعنوان بالتفصيل"
required
></textarea>

<button type="submit">
✅ تأكيد الطلب
</button>

<div id="orderMessage" class="message"></div>

</form>

</section>


<!-- حساب البائع -->

<section id="account" class="page">

<div id="accountContent">

<h2>👤 حساب البائع</h2>

<div class="account-box">

<h3>📝 إنشاء حساب بائع</h3>

<form onsubmit="signupSeller(event)">

<input
type="text"
id="signupName"
placeholder="اسم البائع"
required
>

<input
type="tel"
id="signupPhone"
placeholder="رقم الهاتف"
required
>

<input
type="email"
id="signupEmail"
placeholder="البريد الإلكتروني"
required
>

<input
type="password"
id="signupPassword"
placeholder="كلمة المرور"
required
>

<button type="submit">
إنشاء الحساب
</button>

<div id="signupMessage" class="message"></div>

</form>

</div>


<br>


<div class="account-box">

<h3>🔐 تسجيل الدخول</h3>

<form onsubmit="loginSeller(event)">

<input
type="email"
id="loginEmail"
placeholder="البريد الإلكتروني"
required
>

<input
type="password"
id="loginPassword"
placeholder="كلمة المرور"
required
>

<button type="submit">
تسجيل الدخول
</button>

<div id="loginMessage" class="message"></div>

</form>

</div>

</div>

</section>

</div>


<footer>

<p>🛒 سوقي DZ</p>

<p>
منصة جزائرية للبيع والشراء
</p>

</footer>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://sjxjhyqayhscbqqniemp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nTr9xyFihJNfs91HVbnHCg_lqFc6x_n";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let products = [];

let selectedProduct = null;

let currentSeller = null;


/* =========================
   تحميل المنتجات
========================= */

async function loadProducts(){

const {data,error} =
await supabaseClient
.from("products")
.select("*")
.order("created_at",{ascending:false});


if(error){

console.error(error);

document.getElementById("products").innerHTML =
"<p>حدث خطأ أثناء تحميل المنتجات</p>";

return;
}


products = data || [];

displayProducts();

}


/* =========================
   عرض المنتجات
========================= */

function displayProducts(){

const container =
document.getElementById("products");

const search =
document.getElementById("search")
.value
.toLowerCase();


const filtered =
products.filter(p =>
(p.name || "")
.toLowerCase()
.includes(search)
);


if(filtered.length === 0){

container.innerHTML =
"<p>لا توجد منتجات.</p>";

return;

}


container.innerHTML =
filtered.map(p => `

<div class="card">

<img
src="${p.image_url || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600'}"
alt="${p.name || 'منتج'}"
>

<h3>
${p.name || "منتج بدون اسم"}
</h3>

<div class="price">
${p.price || 0} دج
</div>

<p>
${p.description || "لا يوجد وصف."}
</p>

<button
onclick="orderProduct('${p.dIdd}')"
>
🛒 اطلب الآن
</button>

</div>

`).join("");

}


/* =========================
   إنشاء حساب بائع
========================= */

async function signupSeller(event){

event.preventDefault();


const name =
document.getElementById("signupName").value.trim();

const phone =
document.getElementById("signupPhone").value.trim();

const email =
document.getElementById("signupEmail").value.trim();

const password =
document.getElementById("signupPassword").value;


const message =
document.getElementById("signupMessage");


message.style.display="none";


const {
data,
error
} =
await supabaseClient.auth.signUp({

email:email,

password:password

});


if(error){

message.className =
"message error";

message.textContent =
"خطأ: " + error.message;

message.style.display="block";

return;

}


if(!data.user){

message.className =
"message error";

message.textContent =
"لم يتم إنشاء المستخدم.";

message.style.display="block";

return;

}


/* إضافة البائع */

const {
error:sellerError
} =
await supabaseClient
.from("sellers")
.insert({

name:name,

phone:phone,

email:email,

auth_user_id:data.user.id

});


if(sellerError){

message.className =
"message error";

message.textContent =
"تم إنشاء الحساب لكن حدث خطأ في بيانات البائع: "
+ sellerError.message;

message.style.display="block";

return;

}


message.className =
"message success";

message.textContent =
"تم إنشاء حساب البائع بنجاح ✅";

message.style.display="block";


await loadCurrentSeller();

}


/* =========================
   تسجيل الدخول
========================= */

async function loginSeller(event){

event.preventDefault();


const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;


const message =
document.getElementById("loginMessage");


message.style.display="none";


const {
data,
error
} =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});


if(error){

message.className =
"message error";

message.textContent =
"خطأ: " + error.message;

message.style.display="block";

return;

}


await loadCurrentSeller();


message.className =
"message success";

message.textContent =
"تم تسجيل الدخول بنجاح ✅";

message.style.display="block";


}


/* =========================
   تحميل بيانات البائع
========================= */

async function loadCurrentSeller(){

const {
data
} =
await supabaseClient.auth.getUser();


if(!data.user){

currentSeller = null;

updateSellerUI();

return;

}


const {
data:seller,
error
} =
await supabaseClient
.from("sellers")
.select("*")
.eq(
"auth_user_id",
data.user.id
)
.single();


if(error){

console.error(error);

currentSeller = null;

}else{

currentSeller = seller;

}


updateSellerUI();

}


/* =========================
   تحديث واجهة البائع
========================= */

function updateSellerUI(){

const userBox =
document.getElementById("userBox");

const sellerStatus =
document.getElementById("sellerStatus");

const accountContent =
document.getElementById("accountContent");


if(currentSeller){

userBox.innerHTML = `
👤 مرحبًا ${currentSeller.name}
`;

sellerStatus.innerHTML = `

<div class="message success"
style="display:block">

أنت مسجل كبائع باسم:
<strong>
${currentSeller.name}
</strong>

</div>

`;

accountContent.innerHTML = `

<div class="account-box">

<h2>👤 حساب البائع</h2>

<p>
<strong>الاسم:</strong>
${currentSeller.name}
</p>

<p>
<strong>الهاتف:</strong>
${currentSeller.phone}
</p>

<p>
<strong>البريد:</strong>
${currentSeller.email}
</p>

<button
class="logout"
onclick="logoutSeller()"
>
🚪 تسجيل الخروج
</button>

</div>

`;

}else{

userBox.innerHTML =
"";

sellerStatus.innerHTML = `

<div class="message error"
style="display:block">

يجب تسجيل الدخول كبائع لإضافة المنتجات.

</div>

`;

}

}


/* =========================
   تسجيل الخروج
========================= */

async function logoutSeller(){

const {
error
} =
await supabaseClient.auth.signOut();


if(error){

alert(
"حدث خطأ أثناء تسجيل الخروج: "
+ error.message
);

return;

}


currentSeller = null;

updateSellerUI();

showPage("home");

}


/* =========================
   إضافة منتج
========================= */

async function addProduct(event){

event.preventDefault();


const message =
document.getElementById("addMessage");


message.style.display="none";


if(!currentSeller){

message.className =
"message error";

message.textContent =
"يجب فتح حساب بائع أولاً.";

message.style.display="block";

return;

}


const name =
document
.getElementById("productName")
.value
.trim();


const price =
Number(
document
.getElementById("productPrice")
.value
);


const image =
document
.getElementById("productImage")
.value
.trim();


const description =
document
.getElementById("productDescription")
.value
.trim();


const {
error
} =
await supabaseClient
.from("products")
.insert({

name:name,

price:price,

description:
description || "لا يوجد وصف.",

image_url:
image ||
"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600",

seller_phone:
currentSeller.phone,

seller_id:
currentSeller.auth_user_id

});


if(error){

console.error(error);

message.className =
"message error";

message.textContent =
"خطأ Supabase: "
+ error.message;

message.style.display="block";

return;

}


message.className =
"message success";

message.textContent =
"تمت إضافة المنتج بنجاح ✅";

message.style.display="block";


document
.querySelector("#add form")
.reset();


await loadProducts();

}


/* =========================
   فتح صفحة الطلب
========================= */

function orderProduct(id){

selectedProduct =
products.find(p =>
String(p.dIdd) === String(id)
);


if(!selectedProduct){

alert("لم يتم العثور على المنتج.");

return;

}


document.getElementById(
"selectedProduct"
).innerHTML = `

<div class="product-info">

<h3>
${selectedProduct.name}
</h3>

<p>
السعر:
<strong>
${selectedProduct.price} دج
</strong>
</p>

<p>
${selectedProduct.description || ""}
</p>

</div>

<br>

`;


document.getElementById(
"orderMessage"
).style.display="none";


showPage("order");

}


/* =========================
   تسجيل الطلب
========================= */

async function submitOrder(event){

event.preventDefault();


const message =
document.getElementById("orderMessage");


message.style.display="none";


if(!selectedProduct){

message.className =
"message error";

message.textContent =
"لم يتم اختيار منتج.";

message.style.display="block";

return;

}


const buyerName =
document
.getElementById("buyerName")
.value
.trim();


const buyerPhone =
document
.getElementById("buyerPhone")
.value
.trim();


const buyerAddress =
document
.getElementById("buyerAddress")
.value
.trim();


const quantity = 1;


const totalPrice =
Number(selectedProduct.price) *
quantity;


const commission =
totalPrice * 0.05;


const {
error
} =
await supabaseClient
.from("orders")
.insert({

product_id:
selectedProduct.dIdd,

buyer_name:
buyerName,

buyer_phone:
buyerPhone,

buyer_address:
buyerAddress,

quantity:
quantity,

total_price:
totalPrice,

commission:
commission

});


if(error){

console.error(error);

message.className =
"message error";

message.textContent =
"حدث خطأ أثناء تسجيل الطلب: "
+ error.message;

message.style.display="block";

return;

}


message.className =
"message success";

message.textContent =
"تم تسجيل الطلب بنجاح ✅";

message.style.display="block";


document
.querySelector("#order form")
.reset();

}


/* =========================
   التنقل بين الصفحات
========================= */

function showPage(page){

document
.querySelectorAll(".page")
.forEach(section => {

section.classList.remove("active");

});


const selected =
document.getElementById(page);


if(selected){

selected.classList.add("active");

}


if(page === "home"){

loadProducts();

}

}


/* =========================
   تشغيل الموقع
========================= */

async function startApp(){

await loadCurrentSeller();

await loadProducts();

}


startApp();

</script>

</body>
   </html>
