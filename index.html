<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سوقي DZ</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#222;
}

header{
background:#111827;
color:white;
padding:18px;
text-align:center;
}

header h1{
margin:0 0 6px;
}

nav{
display:flex;
justify-content:center;
gap:10px;
margin-top:15px;
flex-wrap:wrap;
}

nav button{
border:0;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
}

.container{
max-width:1100px;
margin:25px auto;
padding:0 15px;
}

.search{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
margin-bottom:20px;
font-size:16px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:190px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.price{
font-size:20px;
font-weight:bold;
margin:10px 0;
}

.btn{
background:#111827;
color:white;
border:0;
padding:11px 15px;
border-radius:8px;
cursor:pointer;
width:100%;
margin-top:8px;
}

.whatsapp{
background:#25D366;
}

.call{
background:#2563eb;
}

.logout{
background:#dc2626;
}

.form{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.form input,
.form textarea{
width:100%;
padding:12px;
margin:8px 0 15px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

.hidden{
display:none;
}

.user-box{
background:#e5e7eb;
color:#111827;
padding:10px;
border-radius:8px;
margin-top:10px;
}

footer{
text-align:center;
padding:30px;
color:#777;
}

</style>

</head>

<body>

<header>

<h1>🛒 سوقي DZ</h1>

<p>سوق إلكتروني جزائري بسيط</p>

<nav>

<button onclick="showPage('home')">
المنتجات
</button>

<button onclick="showPage('add')">
أضف منتجًا
</button>

<button onclick="showPage('account')">
حساب البائع
</button>

</nav>

<div id="userBox"></div>

</header>


<div class="container">


<!-- المنتجات -->

<section id="home">

<h2>المنتجات</h2>

<input
class="search"
id="search"
placeholder="🔎 ابحث عن منتج..."
oninput="displayProducts">

<div class="products" id="products">

<p>جاري تحميل المنتجات...</p>

</div>

</section>


<!-- إضافة منتج -->

<section id="add" class="hidden">

<h2>إضافة منتج</h2>

<div class="form">

<p id="sellerStatus"></p>

<label>اسم المنتج</label>

<input
id="productName"
placeholder="مثال: هاتف">


<label>السعر بالدينار</label>

<input
id="productPrice"
type="number"
placeholder="مثال: 25000">


<label>رابط صورة المنتج</label>

<input
id="productImage"
placeholder="ضع رابط الصورة">


<label>وصف المنتج</label>

<textarea
id="productDescription"
placeholder="اكتب وصفًا مختصرًا"></textarea>


<button
class="btn"
onclick="addProduct()">

إضافة المنتج

</button>

</div>

</section>


<!-- الطلب -->

<section id="order" class="hidden">

<h2>طلب المنتج</h2>

<div class="form">

<p id="selectedProduct"></p>

<label>اسمك</label>

<input
id="buyerName"
placeholder="اسمك الكامل">


<label>رقم الهاتف</label>

<input
id="buyerPhone"
type="tel"
placeholder="رقم الهاتف">


<label>الولاية والعنوان</label>

<textarea
id="buyerAddress"
placeholder="الولاية والعنوان"></textarea>


<button
class="btn"
onclick="submitOrder()">

تأكيد الطلب

</button>

</div>

</section>


<!-- حساب البائع -->

<section id="account" class="hidden">

<h2>حساب البائع</h2>


<!-- تسجيل -->

<div
class="form"
id="signupBox">

<h3>إنشاء حساب بائع</h3>

<label>اسمك</label>

<input
id="sellerName"
placeholder="اسم البائع">


<label>رقم الهاتف</label>

<input
id="sellerPhone"
type="tel"
placeholder="مثال: 0550123456">


<label>البريد الإلكتروني</label>

<input
id="sellerEmail"
type="email"
placeholder="example@gmail.com">


<label>كلمة المرور</label>

<input
id="sellerPassword"
type="password"
placeholder="كلمة المرور">


<button
class="btn"
onclick="signupSeller()">

إنشاء الحساب

</button>

</div>


<br>


<!-- تسجيل الدخول -->

<div
class="form"
id="loginBox">

<h3>تسجيل الدخول</h3>

<label>البريد الإلكتروني</label>

<input
id="loginEmail"
type="email"
placeholder="البريد الإلكتروني">


<label>كلمة المرور</label>

<input
id="loginPassword"
type="password"
placeholder="كلمة المرور">


<button
class="btn"
onclick="loginSeller()">

تسجيل الدخول

</button>

</div>


<!-- الحساب بعد تسجيل الدخول -->

<div
class="form hidden"
id="loggedBox">

<h3>👤 حسابك</h3>

<p id="loggedInfo"></p>

<button
class="btn logout"
onclick="logoutSeller()">

تسجيل الخروج

</button>

</div>

</section>

</div>


<footer>

سوقي DZ © 2026

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
'https://sjxjhyqayhscbqqniemp.supabase.co';

const SUPABASE_KEY =
'sb_publishable_nTr9xyFihJNfs91HVbnHCg_lqFc6x_n';

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let products = [];

let selectedProduct = null;

let currentSeller = null;


/* =========================
   تحميل المنتجات
========================= */

async function loadProducts(){

const { data, error } =
await supabaseClient
.from("products")
.select("*")
.order("created_at", {
ascending:false
});


if(error){

console.error(error);

document.getElementById("products").innerHTML =
"<p>حدث خطأ أثناء تحميل المنتجات.</p>";

return;

}

products = data || [];

displayProducts();

}


/* =========================
   عرض المنتجات
========================= */

function displayProducts(){

let search =
document
.getElementById("search")
.value
.toLowerCase();


let list =
products.filter(p =>
(p.name || "")
.toLowerCase()
.includes(search)
);


let html = "";


list.forEach((p)=>{

html += `

<div class="card">

<img
src="${p.image_url || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600'}"
alt="${p.name}">

<div class="card-content">

<h3>${p.name}</h3>

<p>${p.description || "لا يوجد وصف."}</p>

<div class="price">
${Number(p.price).toLocaleString()} دج
</div>

<button
class="btn"
onclick="orderProduct('${p.dIdd}')">

اطلب المنتج

</button>

</div>

</div>

`;

});


document.getElementById("products").innerHTML =
html ||
"<p>لم يتم العثور على منتجات.</p>";

}


/* =========================
   إنشاء حساب البائع
========================= */

async function signupSeller(){

let name =
document
.getElementById("sellerName")
.value
.trim();

let phone =
document
.getElementById("sellerPhone")
.value
.trim();

let email =
document
.getElementById("sellerEmail")
.value
.trim();

let password =
document
.getElementById("sellerPassword")
.value;


if(!name || !phone || !email || !password){

alert("يرجى ملء جميع المعلومات.");

return;

}


const { data, error } =
await supabaseClient.auth.signUp({

email:email,

password:password

});


if(error){

alert(
"خطأ أثناء إنشاء الحساب:\n" +
error.message
);

return;

}


if(!data.user){

alert("تعذر إنشاء الحساب.");

return;

}


/* حفظ معلومات البائع */

const { error: sellerError } =
await supabaseClient
.from("sellers")
.insert({

name:name,

phone:phone,

email:email,

auth_user_id:data.user.id

});


if(sellerError){

console.error(sellerError);

alert(
"تم إنشاء حساب الدخول، لكن حدث خطأ في حفظ بيانات البائع:\n" +
sellerError.message
);

return;

}


currentSeller = {

id:data.user.id,

name:name,

phone:phone,

email:email

};


updateSellerUI();

alert(
"تم إنشاء حساب البائع بنجاح."
);

showPage("add");

}


/* =========================
   تسجيل الدخول
========================= */

async function loginSeller(){

let email =
document
.getElementById("loginEmail")
.value
.trim();

let password =
document
.getElementById("loginPassword")
.value;


if(!email || !password){

alert("أدخل البريد الإلكتروني وكلمة المرور.");

return;

}


const { data, error } =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});


if(error){

alert(
"خطأ في تسجيل الدخول:\n" +
error.message
);

return;

}


await loadCurrentSeller();

alert("تم تسجيل الدخول بنجاح.");

showPage("add");

}


/* =========================
   تحميل بيانات البائع
========================= */

async function loadCurrentSeller(){

const { data } =
await supabaseClient.auth.getUser();


if(!data.user){

currentSeller = null;

updateSellerUI();

return;

}


const { data: seller } =
await supabaseClient
.from("sellers")
.select("*")
.eq("auth_user_id", data.user.id)
.single();


if(seller){

currentSeller = seller;

}else{

currentSeller = null;

}


updateSellerUI();

}


/* =========================
   تحديث واجهة الحساب
========================= */

function updateSellerUI(){

let userBox =
document.getElementById("userBox");

if(currentSeller){

userBox.innerHTML = `

<div class="user-box">

👤 مرحبًا ${currentSeller.name}

</div>

`;

document
.getElementById("signupBox")
.classList.add("hidden");

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("loggedBox")
.classList.remove("hidden");

document
.getElementById("loggedInfo")
.innerHTML =

"<strong>الاسم:</strong> " +
currentSeller.name +

"<br><strong>الهاتف:</strong> " +
currentSeller.phone +

"<br><strong>البريد:</strong> " +
currentSeller.email;


document
.getElementById("sellerStatus")
.innerHTML =

"✅ أنت مسجل الدخول باسم <strong>" +
currentSeller.name +
"</strong><br>" +

"رقم هاتفك: " +
currentSeller.phone;

}else{

userBox.innerHTML = "";

document
.getElementById("signupBox")
.classList.remove("hidden");

document
.getElementById("loginBox")
.classList.remove("hidden");

document
.getElementById("loggedBox")
.classList.add("hidden");

document
.getElementById("sellerStatus")
.innerHTML =

"⚠️ يجب تسجيل الدخول كبائع قبل إضافة منتج.";

}

}


/* =========================
   تسجيل الخروج
========================= */

async function logoutSeller(){

await supabaseClient.auth.signOut();

currentSeller = null;

updateSellerUI();

showPage("home");

alert("تم تسجيل الخروج.");

}


/* =========================
   إضافة منتج
========================= */

async function addProduct(){

if(!currentSeller){

alert(
"يجب إنشاء حساب بائع وتسجيل الدخول أولًا."
);

showPage("account");

return;

}


let name =
document
.getElementById("productName")
.value
.trim();


let price =
Number(
document
.getElementById("productPrice")
.value
);


let image =
document
.getElementById("productImage")
.value
.trim();


let description =
document
.getElementById("productDescription")
.value
.trim();


if(!name || !price){

alert(
"أدخل اسم المنتج والسعر."
);

return;

}


const { error } =
await supabaseClient
.from("products")
.insert({

name:name,

price:price,

description:
description || "لا يوجد وصف.",

image_url:
image ||
"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600",

seller_phone:
currentSeller.phone,

seller_id:
currentSeller.auth_user_id

});


if(error){

console.error(error);

alert(
"خطأ Supabase:\n" +
error.message
);

return;

}


alert(
"تمت إضافة المنتج بنجاح."
);


document
.getElementById("productName")
.value="";

document
.getElementById("productPrice")
.value="";

document
.getElementById("productImage")
.value="";

document
.getElementById("productDescription")
.value="";


await loadProducts();

showPage("home");

}


/* =========================
   طلب المنتج
========================= */

function orderProduct(id){

selectedProduct =
products.find(p =>
String(p.dIdd) === String(id)
);


if(!selectedProduct){

alert(
"تعذر العثور على المنتج."
);

return;

}


let phone =
selectedProduct.seller_phone || "";


let contactButtons = "";


if(phone){

let cleanPhone =
phone.replace(/\D/g,'');


let whatsappPhone =
cleanPhone;


if(cleanPhone.startsWith("0")){

whatsappPhone =
"213" +
cleanPhone.substring(1);

}


contactButtons = `

<hr>

<p>
<strong>📞 تواصل مع البائع</strong>
</p>

<a
href="tel:${phone}"
style="text-decoration:none;">

<button class="btn call">
📞 الاتصال بالبائع
</button>

</a>

<a
href="https://wa.me/${whatsappPhone}"
target="_blank"
style="text-decoration:none;">

<button class="btn whatsapp">
💬 التواصل عبر واتساب
</button>

</a>

`;

}


document
.getElementById("selectedProduct")
.innerHTML =

"<strong>" +
selectedProduct.name +
"</strong><br>" +

"السعر: " +
Number(selectedProduct.price).toLocaleString() +
" دج" +

contactButtons;


showPage("order");

}


/* =========================
   تسجيل الطلب
========================= */

async function submitOrder(){

if(!selectedProduct){

alert(
"لم يتم اختيار منتج."
);

return;

}


let buyerName =
document
.getElementById("buyerName")
.value
.trim();


let buyerPhone =
document
.getElementById("buyerPhone")
.value
.trim();


let buyerAddress =
document
.getElementById("buyerAddress")
.value
.trim();


if(
!buyerName ||
!buyerPhone ||
!buyerAddress
){

alert(
"يرجى ملء جميع المعلومات."
);

return;

}


let totalPrice =
Number(selectedProduct.price);


let commission =
totalPrice * 0.05;


const { error } =
await supabaseClient
.from("orders")
.insert({

product_id:
selectedProduct.dIdd,

buyer_name:
buyerName,

buyer_phone:
buyerPhone,

buyer_address:
buyerAddress,

quantity:1,

total_price:
totalPrice,

commission:
commission

});


if(error){

console.error(error);

alert(
"حدث خطأ أثناء تسجيل الطلب:\n" +
error.message
);

return;

}


alert(

"تم تسجيل الطلب بنجاح!\n\n" +

"سعر المنتج: " +

totalPrice.toLocaleString() +

" دج"

);


document
.getElementById("buyerName")
.value="";

document
.getElementById("buyerPhone")
.value="";

document
.getElementById("buyerAddress")
.value="";


selectedProduct = null;

showPage("home");

}


/* =========================
   التنقل بين الصفحات
========================= */

function showPage(page){

document
.getElementById("home")
.classList.add("hidden");

document
.getElementById("add")
.classList.add("hidden");

document
.getElementById("order")
.classList.add("hidden");

document
.getElementById("account")
.classList.add("hidden");


document
.getElementById(page)
.classList.remove("hidden");


if(page === "home"){

displayProducts();

}


if(page === "add"){

updateSellerUI();

}

}


/* =========================
   تشغيل الموقع
========================= */

async function startApp(){

await loadCurrentSeller();

await loadProducts();

}


startApp();

</script>

</body>

</html>
