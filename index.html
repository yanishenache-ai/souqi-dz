
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوقي DZ</title>

<style>
*{box-sizing:border-box}
<script>
const SUPABASE_URL = 'https://sjxjhyqayhscbqqniemp.supabase.co';
const SUPABASE_KEY = 'ضع_المفتاح_الذي_نسخته_هنا';

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
</script>body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}
header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
}
header h1{margin:0 0 6px}
nav{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}
nav button{
    border:0;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
}
.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}
.search{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:20px;
    font-size:16px;
}
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
}
.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}
.card img{
    width:100%;
    height:190px;
    object-fit:cover;
}
.card-content{padding:15px}
.price{
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}
.btn{
    background:#111827;
    color:white;
    border:0;
    padding:11px 15px;
    border-radius:8px;
    cursor:pointer;
    width:100%;
}
.form{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}
.form input,.form textarea{
    width:100%;
    padding:12px;
    margin:8px 0 15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}
.hidden{display:none}
.order{
    background:white;
    padding:15px;
    margin-bottom:12px;
    border-radius:10px;
}
footer{
    text-align:center;
    padding:30px;
    color:#777;
}
</style>
</head>

<body>

<header>
<h1>🛒 سوقي DZ</h1>
<p>سوق إلكتروني جزائري بسيط</p>

<nav>
<button onclick="showPage('home')">المنتجات</button>
<button onclick="showPage('add')">أضف منتجًا</button>
<button onclick="showPage('orders')">الطلبات</button>
</nav>
</header>

<div class="container">

<section id="home">
<h2>المنتجات</h2>

<input
class="search"
id="search"
placeholder="🔎 ابحث عن منتج..."
oninput="displayProducts()">

<div class="products" id="products"></div>
</section>


<section id="add" class="hidden">
<h2>إضافة منتج</h2>

<div class="form">

<label>اسم المنتج</label>
<input id="productName" placeholder="مثال: هاتف">

<label>السعر بالدينار</label>
<input id="productPrice" type="number" placeholder="مثال: 25000">

<label>رابط صورة المنتج</label>
<input id="productImage" placeholder="ضع رابط الصورة">

<label>وصف المنتج</label>
<textarea id="productDescription" placeholder="اكتب وصفًا مختصرًا"></textarea>

<button class="btn" onclick="addProduct()">إضافة المنتج</button>

</div>
</section>


<section id="orders" class="hidden">
<h2>الطلبات</h2>
<div id="ordersList"></div>
</section>

</div>

<footer>
سوقي DZ © 2026
</footer>


<script>

let products = JSON.parse(localStorage.getItem("souqi_products")) || [

{
name:"هاتف ذكي",
price:35000,
image:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600",
description:"هاتف ذكي بحالة ممتازة"
},

{
name:"سماعات لاسلكية",
price:4500,
image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600",
description:"سماعات لاسلكية"
},

{
name:"ساعة ذكية",
price:8000,
image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600",
description:"ساعة ذكية أنيقة"
}

];

let orders = JSON.parse(localStorage.getItem("souqi_orders")) || [];


function save(){
localStorage.setItem("souqi_products",JSON.stringify(products));
localStorage.setItem("souqi_orders",JSON.stringify(orders));
}


function displayProducts(){

let search=document.getElementById("search").value.toLowerCase();

let list=products.filter(p =>
p.name.toLowerCase().includes(search)
);

let html="";

list.forEach((p,index)=>{

html+=`

<div class="card">

<img src="${p.image}" alt="${p.name}">

<div class="card-content">

<h3>${p.name}</h3>

<p>${p.description}</p>

<div class="price">${p.price.toLocaleString()} دج</div>

<button class="btn" onclick="orderProduct(${index})">
اطلب المنتج
</button>

</div>
</div>

`;

});

document.getElementById("products").innerHTML=
html || "<p>لم يتم العثور على منتجات.</p>";

}


function addProduct(){

let name=document.getElementById("productName").value.trim();
let price=Number(document.getElementById("productPrice").value);
let image=document.getElementById("productImage").value.trim();
let description=document.getElementById("productDescription").value.trim();

if(!name || !price){

alert("أدخل اسم المنتج والسعر.");
return;

}

products.push({
name:name,
price:price,
image:image || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600",
description:description || "لا يوجد وصف."
});

save();

alert("تمت إضافة المنتج.");

document.getElementById("productName").value="";
document.getElementById("productPrice").value="";
document.getElementById("productImage").value="";
document.getElementById("productDescription").value="";

displayProducts();

showPage("home");

}


function orderProduct(index){

let p=products[index];

let name=prompt("أدخل اسمك:");

if(!name)return;

let phone=prompt("أدخل رقم الهاتف:");

if(!phone)return;

let address=prompt("أدخل الولاية والعنوان:");

if(!address)return;

orders.push({

product:p.name,
price:p.price,
customer:name,
phone:phone,
address:address,
commission:p.price*0.05,
date:new Date().toLocaleString("ar-DZ")

});

save();

alert(
"تم تسجيل الطلب بنجاح!\\n\\n"+
"عمولة سوقي DZ: "+
(p.price*0.05).toLocaleString()+
" دج"
);

displayOrders();

}


function displayOrders(){

let html="";

orders.forEach(o=>{

html+=`

<div class="order">

<strong>${o.product}</strong>

<p>السعر: ${o.price.toLocaleString()} دج</p>

<p>الزبون: ${o.customer}</p>

<p>الهاتف: ${o.phone}</p>

<p>العنوان: ${o.address}</p>

<p>عمولة سوقي DZ: ${o.commission.toLocaleString()} دج</p>

<small>${o.date}</small>

</div>

`;

});

document.getElementById("ordersList").innerHTML=
html || "<p>لا توجد طلبات حتى الآن.</p>";

}


function showPage(page){

document.getElementById("home").classList.add("hidden");
document.getElementById("add").classList.add("hidden");
document.getElementById("orders").classList.add("hidden");

document.getElementById(page).classList.remove("hidden");

if(page==="home")displayProducts();
if(page==="orders")displayOrders();

}


displayProducts();
displayOrders();

</script>

</body>
  </html>
